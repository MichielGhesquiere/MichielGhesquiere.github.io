<div class="pj-card"><p class="pj-meta"><span>{{ include.p.meta }}</span><span class="pj-count">{{ include.i }} / {{ include.n }}</span></p><h3 class="pj-title">{{ include.p.title }}</h3><p class="pj-text">{{ include.p.text }}</p><ul class="pj-tags">{% for t in include.p.tags %}<li>{{ t }}</li>{% endfor %}</ul><p class="pj-links"><a href="{{ include.p.link }}">{{ include.p.link_text }} →</a></p></div>
